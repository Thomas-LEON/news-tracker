name: Daily Threat Intel Tracker

on:
  schedule:
    - cron: '0 6 * * *' # Tous les jours du Lundi au Vendredi à 06:00 UTC
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Nécessaire pour faire le push du rapport généré

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run News Tracker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_tracker.py

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/
          # Commit seulement si de nouveaux fichiers ont été créés
          git diff --quiet && git diff --staged --quiet || (git commit -m "📝 Add daily threat intel report" && git push)
