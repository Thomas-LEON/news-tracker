name: Daily Threat Intel Tracker

on:
  schedule:
    - cron: '0 11 * * *' # Tous les jours à 06:00 UTC
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Nécessaire pour faire le push du rapport généré

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lancer la generation du rapport
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 300
          command: python src/news_tracker.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OUTPUT_FORMAT: markdown
          GITHUB_ACTIONS: 'true'

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/ newsletters/ locks/
          if ! git diff --staged --quiet; then
            git commit -m "📝 Add daily threat intel report [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new threat intelligence reports generated today."
          fi
